<!DOCTYPE html>
<html lang="en">

<head>
  <title>Document</title>
  <link rel="stylesheet" href="/html_exercises/ep6table/colspan_rowspan.css">
</head>

<body>
  <div class="title">
    <h1><u>colspan with rowspan</u></h1>
  </div>

  <div class="example">
    <table class="container1">
      <thead>
        <tr class="bg-color-blue">
          <th rowspan="2">SESSION</th>
          <th rowspan="2">Food</th>
          <th colspan="2" style="padding: 20px;">FOOD price </th>
        </tr>
        <tr>
          <th class="bg-color-red">Quantity</th>
          <th class="bg-color-gold">Price</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th rowspan="3" class="bg-color-purple">MORNING</td>
          <td class="bg-color-orange">idly</td>
          <td class="bg-color-orange">4</td>
          <td class="bg-color-orange">10</td>
        </tr>
        <tr>
          <td class="bg-color-orange">tea</td>
          <td class="bg-color-orange">1</td>
          <td class="bg-color-orange">15</td>
        </tr>
        <tr>
          <td class="bg-color-orange">vadai</td>
          <td class="bg-color-orange">2</td>
          <td class="bg-color-orange">12</td>
        </tr>

      </tbody>
      <tfoot>
        <tr>
          <th colspan="3" class="bg-color-black"> TOTAL</th>
          <td class="bg-color-green"> 79 </td>
        </tr>
      </tfoot>

    </table>
  </div>
</body>

</html>
